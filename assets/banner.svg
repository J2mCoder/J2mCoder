<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">J2mCoder — Full-Stack Developer</title>
  <desc id="banner-desc">A dark midnight-blue banner with cyan accents. The name J2mCoder appears above the lines Backend Engineering, Web and Mobile Development, and a three-layer system diagram labelled Client, API and Data.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A14"/>
      <stop offset="0.55" stop-color="#081426"/>
      <stop offset="1" stop-color="#0B1E36"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.58">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="diagram-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#background)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <ellipse cx="1032" cy="170" rx="230" ry="170" fill="url(#diagram-glow)"/>

  <rect x="0" y="0" width="1280" height="1" fill="#1E293B"/>
  <rect x="0" y="339" width="1280" height="1" fill="#1E293B"/>

  <rect x="64" y="66" width="4" height="220" rx="2" fill="url(#accent)"/>

  <text x="96" y="98" fill="#22D3EE" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4.5">FULL-STACK DEVELOPER</text>

  <text x="93" y="184" fill="#F8FAFC" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-1.8">J2mCoder</text>

  <text x="96" y="232" fill="#CBD5E1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400">Backend Engineering · Web &amp; Mobile Development</text>

  <text x="96" y="280" fill="#64748B" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', monospace" font-size="14" letter-spacing="1.4">APIs · DATA · AUTHENTICATION · SYSTEMS</text>

  <g>
    <rect x="872" y="38" width="320" height="264" rx="18" fill="#07101F" fill-opacity="0.72" stroke="#1E293B"/>
    <text x="896" y="64" fill="#475569" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', monospace" font-size="10" letter-spacing="2.4">SYSTEM</text>

    <rect x="896" y="78" width="272" height="54" rx="10" fill="#0A1729" stroke="#1E3A5F"/>
    <circle cx="918" cy="105" r="3" fill="#22D3EE"/>
    <text x="934" y="101" fill="#7DD3FC" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', monospace" font-size="13" font-weight="600" letter-spacing="1.1">CLIENT</text>
    <text x="934" y="118" fill="#64748B" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11">React · Next.js</text>

    <line x1="1032" y1="132" x2="1032" y2="152" stroke="#1E3A5F" stroke-width="1.5"/>
    <circle cx="1032" cy="142" r="2.5" fill="#38BDF8"/>

    <rect x="896" y="152" width="272" height="54" rx="10" fill="#0A1729" stroke="#1E3A5F"/>
    <circle cx="918" cy="179" r="3" fill="#22D3EE"/>
    <text x="934" y="175" fill="#7DD3FC" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', monospace" font-size="13" font-weight="600" letter-spacing="1.1">API</text>
    <text x="934" y="192" fill="#64748B" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11">Node.js · REST</text>

    <line x1="1032" y1="206" x2="1032" y2="226" stroke="#1E3A5F" stroke-width="1.5"/>
    <circle cx="1032" cy="216" r="2.5" fill="#38BDF8"/>

    <rect x="896" y="226" width="272" height="54" rx="10" fill="#0A1729" stroke="#1E3A5F"/>
    <circle cx="918" cy="253" r="3" fill="#22D3EE"/>
    <text x="934" y="249" fill="#7DD3FC" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', monospace" font-size="13" font-weight="600" letter-spacing="1.1">DATA</text>
    <text x="934" y="266" fill="#64748B" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11">PostgreSQL · MongoDB</text>
  </g>
</svg>
